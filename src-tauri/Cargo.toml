[package]
name = "puppergram"
version = "1.0.0"
description = "Neonatal litter monitor — gram by gram, day by day"
authors = ["Puppergram"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
