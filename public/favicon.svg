<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Puppergram">
  <defs>
    <linearGradient id="pg" x1="10" y1="54" x2="46" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9E44"/>
      <stop offset="0.55" stop-color="#FF4D8D"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#171019"/>

  <!-- Baseline, so the mark reads as a chart rather than a swoosh. -->
  <path d="M11 53 H45" stroke="#F8EDE4" stroke-opacity="0.22" stroke-width="2.4"
        stroke-linecap="round" fill="none"/>

  <!-- The growth curve: flat at first, then climbing. -->
  <path d="M12 48 C 23 47.5, 30 42, 38.5 27"
        fill="none" stroke="url(#pg)" stroke-width="5"
        stroke-linecap="round"/>

  <!-- ...rising into a paw print. -->
  <g fill="#F8EDE4">
    <ellipse cx="46" cy="23.5" rx="6.6" ry="5.1"/>
    <ellipse cx="38.6" cy="17.4" rx="2.6" ry="3.2" transform="rotate(-25 38.6 17.4)"/>
    <ellipse cx="43.6" cy="12.9" rx="2.7" ry="3.4"/>
    <ellipse cx="49.6" cy="12.9" rx="2.7" ry="3.4"/>
    <ellipse cx="54.4" cy="17.4" rx="2.6" ry="3.2" transform="rotate(25 54.4 17.4)"/>
  </g>
</svg>
